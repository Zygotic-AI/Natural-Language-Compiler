name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must equal the version file
        run: test "$GITHUB_REF_NAME" = "v$(python3 -c 'import json; print(json.load(open("integrity/nlc-version.json"))["version"])')"

      - name: Build release tarball
        run: python3 tools/nlc-release-build.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nlc-*.tar.gz
          body_path: docs/adoption/RELEASE-${{ github.ref_name }}.md
          generate_release_notes: false
